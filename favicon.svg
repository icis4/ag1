<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Melexis IO Tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2133"/>
      <stop offset="100%" stop-color="#0b0e17"/>
    </linearGradient>
    <!-- userSpaceOnUse: an objectBoundingBox gradient never paints a
         zero-width shape, which silently dropped the connector stems. -->
    <linearGradient id="fg" gradientUnits="userSpaceOnUse" x1="9" y1="6" x2="55" y2="58">
      <stop offset="0%" stop-color="#48e8d6"/>
      <stop offset="100%" stop-color="#2bb5c7"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Same USB connector mark as the topbar and frontpage brand -->
  <g stroke="url(#fg)" fill="none" stroke-width="5.5" stroke-linecap="round">
    <path d="M32 7v13M32 44v13"/>
    <rect x="10" y="20" width="44" height="24" rx="7"/>
  </g>
  <g fill="url(#fg)">
    <circle cx="24" cy="32" r="3.6"/>
    <circle cx="40" cy="32" r="3.6"/>
  </g>
</svg>
